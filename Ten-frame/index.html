<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>十格阵 · 1 到 10 · 数小汽车学习卡（10 张 A4）</title>

<link href="https://g.alicdn.com/code/lib/daisyui/5.1.25/daisyui.css" rel="stylesheet" type="text/css"/>
<link href="https://g.alicdn.com/code/lib/daisyui/5.1.25/themes.css" rel="stylesheet" type="text/css"/>
<script src="https://g.alicdn.com/code/lib/react/17.0.2/umd/react.development.js"></script>
<script src="https://g.alicdn.com/code/lib/react-dom/17.0.2/umd/react-dom.development.js"></script>
<script src="https://g.alicdn.com/code/lib/react-router-dom/5.3.4/react-router-dom.js"></script>
<script src="https://g.alicdn.com/code/lib/tailwindcss-browser/4.1.13/index.global.js"></script>
<script src="https://g.alicdn.com/code/lib/babel-standalone/7.25.0/babel.min.js"></script>

<style type="text/tailwindcss">
  @theme {
    --color-paper: #fffdf7;
    --color-ink: #1a1a2e;
    --font-display: "Baloo 2", "Fredoka", "Comic Sans MS", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --font-body: "Quicksand", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  }
  html, body {
    background: #efe9dc;
    color: var(--color-ink);
    font-family: var(--font-body);
    margin: 0;
  }
  .num-font {
    font-family: var(--font-display);
    font-weight: 900;
    letter-spacing: -0.04em;
  }

  /* ==== 一张 A4 卡片的屏幕展示尺寸（横版）====
     A4 横版：297mm × 210mm，比例 1.414
     屏幕上用 1100x778 模拟，留白后转打印 */
  .a4-card {
    width: 297mm;
    height: 210mm;
    background: #fffdf7;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.25);
    margin: 24px auto;
    position: relative;
    overflow: hidden;
    page-break-after: always;
    break-after: page;
  }
  .a4-card:last-child {
    page-break-after: auto;
    break-after: auto;
  }

  /* 十格阵格子：粗黑线 + 圆角 */
  .ten-frame {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    border: 4px solid #1a1a2e;
    border-radius: 14px;
    overflow: hidden;
    background: #ffffff;
  }
  .ten-cell {
    border-right: 3px solid #1a1a2e;
    border-bottom: 3px solid #1a1a2e;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #ffffff;
  }
  /* 中间那条更粗，区分上 5 / 下 5 */
  .ten-cell.row-top {
    border-bottom-width: 4px;
  }
  /* 去掉最右列右边线、最下行下边线 */
  .ten-cell.col-last {
    border-right: 0;
  }
  .ten-cell.row-bottom {
    border-bottom: 0;
  }

  /* ============ 打印优化 ============ */
  @page {
    size: A4 landscape;
    margin: 0;
  }
  @media print {
    html, body {
      background: #ffffff !important;
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }
    .no-print { display: none !important; }
    .a4-card {
      box-shadow: none !important;
      margin: 0 !important;
      width: 297mm !important;
      height: 210mm !important;
    }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
  const { useMemo } = React;

  // 十种小汽车：一张卡一种车型
  const CARDS = [
    { n: 1,  bg: "#FF6B6B", soft: "#FFE9E9", car: "🚗", name: "小轿车",  read: "一" },
    { n: 2,  bg: "#FF9F43", soft: "#FFEFDA", car: "🚕", name: "出租车",  read: "二" },
    { n: 3,  bg: "#F4B400", soft: "#FFF1C2", car: "🚙", name: "越野车",  read: "三" },
    { n: 4,  bg: "#1DD1A1", soft: "#D6F7EB", car: "🚌", name: "公交车",  read: "四" },
    { n: 5,  bg: "#3DB8FF", soft: "#DCEFFF", car: "🚑", name: "救护车",  read: "五" },
    { n: 6,  bg: "#EF5350", soft: "#FFDDDD", car: "🚒", name: "消防车",  read: "六" },
    { n: 7,  bg: "#5F6FFF", soft: "#DFE3FF", car: "🚓", name: "警车",    read: "七" },
    { n: 8,  bg: "#9C27B0", soft: "#EFD9F5", car: "🏎️", name: "赛车",   read: "八" },
    { n: 9,  bg: "#00897B", soft: "#CFEDE8", car: "🚚", name: "大卡车",  read: "九" },
    { n: 10, bg: "#8D6E63", soft: "#EAE0DB", car: "🚜", name: "拖拉机",  read: "十" },
  ];

  // 计算每个格子的 class：是否最右列、是否上半行/下半行
  function cellClass(idx) {
    const row = Math.floor(idx / 5);
    const col = idx % 5;
    const classes = ["ten-cell"];
    if (col === 4) classes.push("col-last");
    if (row === 0) classes.push("row-top");
    if (row === 1) classes.push("row-bottom");
    return classes.join(" ");
  }

  function TenFrame({ count, car, bg, soft }) {
    // 10 个格子，前 count 个填车
    const cells = Array.from({ length: 10 }, (_, i) => i);
    return (
      <div
        className="ten-frame"
        style={{
          width: "210mm",
          height: "84mm",
        }}
      >
        {cells.map((i) => {
          const filled = i < count;
          return (
            <div
              key={i}
              className={cellClass(i)}
              style={{
                background: filled ? soft : "#ffffff",
              }}
            >
              {filled ? (
                <span
                  className="select-none leading-none"
                  style={{ fontSize: "60px" }}
                >
                  {car}
                </span>
              ) : (
                <span
                  className="select-none"
                  style={{
                    color: "#1a1a2e",
                    opacity: 0.18,
                    fontSize: "30px",
                  }}
                >
                  ?
                </span>
              )}
            </div>
          );
        })}
      </div>
    );
  }

  function Card({ item, idx, total }) {
    const { n, bg, soft, car, name, read } = item;
    return (
      <section
        className="a4-card"
        style={{
          // 顶部彩色腰带 + 主纸面
          background: `linear-gradient(180deg, ${bg} 0 18mm, #fffdf7 18mm 100%)`,
        }}
      >
        {/* 顶部彩带：序号 / 卡片名 / 页码 */}
        <header
          className="absolute top-0 left-0 right-0 flex items-center justify-between px-10"
          style={{ height: "18mm", color: "#fff" }}
        >
          <div className="flex items-center gap-3">
            <span
              className="num-font bg-white/20 rounded-full flex items-center justify-center"
              style={{ width: "44px", height: "44px", fontSize: "22px" }}
            >
              {n}
            </span>
            <div>
              <p className="text-[11px] tracking-[0.4em] uppercase opacity-80 font-bold">
                Ten Frame · 十格阵
              </p>
              <p className="text-lg font-bold tracking-wider">
                数一数 · {name}
              </p>
            </div>
          </div>
          <div className="text-right">
            <p className="text-[11px] tracking-[0.3em] opacity-80 font-bold">CARD</p>
            <p className="num-font text-2xl leading-none">
              {String(idx + 1).padStart(2, "0")} / {String(total).padStart(2, "0")}
            </p>
          </div>
        </header>

        {/* 主体：左侧大数字 + 读法，右侧十格阵 */}
        <div
          className="absolute left-0 right-0 flex items-center justify-between px-12"
          style={{ top: "22mm", bottom: "16mm" }}
        >
          {/* 左：大数字 */}
          <div className="flex flex-col items-center justify-center" style={{ width: "70mm" }}>
            <span
              className="num-font leading-none"
              style={{
                fontSize: "260px",
                color: bg,
                textShadow: `8px 8px 0 rgba(0,0,0,0.06)`,
              }}
            >
              {n}
            </span>
            <span
              className="mt-3 num-font text-3xl"
              style={{ color: "#1a1a2e" }}
            >
              {read}
            </span>
            <span className="mt-1 text-base text-[#1a1a2e]/60 font-semibold tracking-[0.2em]">
              {name.toUpperCase ? name : name}
            </span>
          </div>

          {/* 右：十格阵 */}
          <div className="flex flex-col items-center">
            <TenFrame count={n} car={car} bg={bg} soft={soft} />
            <p className="mt-5 text-base text-[#1a1a2e]/70">
              方格里有 <span className="num-font text-2xl" style={{ color: bg }}>{n}</span> 辆{name}，
              还差 <span className="num-font text-2xl" style={{ color: "#1a1a2e" }}>{10 - n}</span> 辆就满 10 了。
            </p>
          </div>
        </div>

        {/* 底部彩条 */}
        <footer
          className="absolute bottom-0 left-0 right-0 flex items-center justify-between px-10"
          style={{ height: "10mm", background: bg, color: "#fff" }}
        >
          <span className="text-[11px] tracking-[0.4em] font-bold uppercase opacity-90">
            For Little Learners · 数与量启蒙
          </span>
          <span className="text-[11px] tracking-[0.3em] font-bold opacity-90">
            打印小贴士：A4 横版 · 开启「背景图形」
          </span>
        </footer>
      </section>
    );
  }

  function Toolbar() {
    const handlePrint = () => window.print();
    return (
      <div className="no-print fixed top-4 right-4 z-50 flex items-center gap-2">
        <a
          href="#card-1"
          className="px-4 py-3 rounded-full bg-white text-[#1a1a2e] font-bold text-sm shadow-lg border border-[#1a1a2e]/10"
        >
          回到第 1 张
        </a>
        <a
          href="practice.html"
          className="px-4 py-3 rounded-full bg-[#FF6B6B] text-white font-bold text-sm shadow-lg hover:bg-[#1a1a2e] transition-colors flex items-center gap-2"
        >
          <span>练习卡</span>
          <span className="text-lg leading-none">→</span>
        </a>
        <button
          onClick={handlePrint}
          className="px-5 py-3 rounded-full bg-[#1a1a2e] text-white font-bold text-sm shadow-lg hover:bg-[#FF6B6B] transition-colors flex items-center gap-2"
        >
          <span className="text-lg">🖨</span>
          <span>打印 10 张卡片</span>
        </button>
      </div>
    );
  }

  function MiniNav() {
    return (
      <nav className="no-print fixed left-4 top-1/2 -translate-y-1/2 z-40 flex flex-col gap-2 bg-white/90 backdrop-blur p-2 rounded-2xl shadow-lg border border-[#1a1a2e]/10">
        {CARDS.map((c) => (
          <a
            key={c.n}
            href={`#card-${c.n}`}
            className="num-font w-9 h-9 rounded-full flex items-center justify-center text-white font-bold text-sm hover:scale-110 transition-transform"
            style={{ background: c.bg }}
            title={`第 ${c.n} 张 · ${c.name}`}
          >
            {c.n}
          </a>
        ))}
      </nav>
    );
  }

  function App() {
    return (
      <div className="relative">
        <Toolbar />
        <MiniNav />
        <div className="py-8">
          {CARDS.map((item, idx) => (
            <div key={item.n} id={`card-${item.n}`}>
              <Card item={item} idx={idx} total={CARDS.length} />
            </div>
          ))}
        </div>
      </div>
    );
  }

  ReactDOM.render(<App />, document.getElementById("root"));
</script>
</body>
</html>
