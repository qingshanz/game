<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>小汽车十格阵 · 加减法</title>
<style>
  /* ===== 全局基础 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", sans-serif;
    background: linear-gradient(160deg, #aee1ff 0%, #d7f0ff 45%, #fff6d6 100%);
    user-select: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    min-height: 100vh;
    overflow-y: auto;               /* 尽量一屏；极小屏可轻微滚动，避免内容被裁切 */
    padding: clamp(6px, 1.5vh, 14px) 10px;
    gap: clamp(4px, 1vh, 10px);
  }

  /* ===== 标题 ===== */
  h1 {
    font-size: clamp(18px, 4.5vw, 28px);
    color: #2b6cb0;
    text-shadow: 2px 2px 0 #fff;
    text-align: center;
    flex: 0 0 auto;
  }

  /* ===== 控制条（模式 / 难度 / 声音）===== */
  .bar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 14px;
    align-items: center;
    justify-content: center;
    flex: 0 0 auto;
  }
  /* 分段开关 */
  .seg-group {
    display: inline-flex;
    background: #ffffffaa;
    border-radius: 999px;
    padding: 3px;
    gap: 3px;
    box-shadow: 0 3px 0 #00000014;
  }
  .seg {
    border: none;
    background: transparent;
    padding: 7px clamp(12px, 3.5vw, 20px);
    border-radius: 999px;
    font-weight: bold;
    color: #2b6cb0;
    font-size: clamp(14px, 3.6vw, 19px);
    cursor: pointer;
    transition: transform .1s;
  }
  .seg.active { background: #2b6cb0; color: #fff; }
  .seg:active { transform: scale(.94); }

  /* 声音选择 */
  .voice {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #2b6cb0;
    font-weight: bold;
  }
  .voice select {
    font-size: 13px;
    padding: 5px 8px;
    border-radius: 8px;
    border: 2px solid #2b6cb0;
    background: #fff;
    color: #2b6cb0;
    max-width: 130px;
  }
  .voice button {
    font-size: 12px;
    padding: 5px 10px;
    border: none;
    border-radius: 8px;
    background: #ffb300;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
  }

  /* ===== 题目区 ===== */
  .question {
    font-size: clamp(26px, 7.5vw, 46px);
    font-weight: bold;
    color: #e65100;
    text-shadow: 2px 2px 0 #fff;
    text-align: center;
    flex: 0 0 auto;
    line-height: 1.1;
  }
  .question .ans {
    color: #2e7031;
    display: inline-block;
    text-shadow: 2px 2px 0 #fff;
    animation: bounce .6s;
  }

  /* ===== 十格阵 ===== */
  .ten-frame {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(2, 1fr);
    gap: clamp(4px, 1.2vw, 8px);
    background: #ffffffcc;
    border: 4px solid #2b6cb0;
    border-radius: 14px;
    padding: clamp(5px, 1.5vw, 9px);
    flex: 0 0 auto;
  }
  .cell {
    width:  min(14vw, 9.5vh, 70px);
    height: min(14vw, 9.5vh, 70px);
    background: #f0f7ff;
    border: 2px dashed #9ec5ff;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: min(9vw, 6.2vh, 46px);
    overflow: hidden;
  }
  .ten-frame .cell:nth-child(5n) { margin-right: clamp(4px, 1.5vw, 10px); }

  .car { display: inline-block; transform: scale(0); animation: pop .35s ease-out forwards; }
  .car.leaving { animation: driveOut 1.1s ease-in forwards; }
  @keyframes pop {
    0% { transform: scale(0) rotate(-30deg); }
    70% { transform: scale(1.25) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
  @keyframes driveOut {
    0% { transform: translateX(0) scale(1); opacity: 1; }
    100% { transform: translateX(180px) scale(.6); opacity: 0; }
  }

  /* ===== 操作按钮 ===== */
  .controls { display: flex; gap: 10px; justify-content: center; flex: 0 0 auto; }
  .big-btn {
    font-size: clamp(16px, 4.5vw, 22px);
    padding: 9px clamp(16px, 5vw, 26px);
    border: none;
    border-radius: 14px;
    background: #ffb300;
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #c98a00;
    transition: transform .1s;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c98a00; }
  .big-btn.green { background: #43a047; box-shadow: 0 4px 0 #2e7031; }

  /* ===== 答案按钮 0~10 ===== */
  .answers {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: clamp(5px, 1.4vw, 9px);
    width: 100%;
    max-width: 430px;
    flex: 0 0 auto;
  }
  .num-btn {
    aspect-ratio: 1;
    font-size: clamp(18px, 5vw, 26px);
    font-weight: bold;
    border: none;
    border-radius: 12px;
    background: #fff;
    color: #2b6cb0;
    cursor: pointer;
    box-shadow: 0 4px 0 #00000018;
    transition: transform .1s;
  }
  .num-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #00000018; }
  .num-btn.correct { background: #43a047; color: #fff; animation: bounce .5s; }
  .num-btn.wrong { background: #e57373; color: #fff; animation: shake .4s; }
  .num-btn:disabled { opacity: .55; cursor: default; }
  @keyframes bounce { 0%,100%{transform:scale(1);} 50%{transform:scale(1.3);} }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-7px);} 75%{transform:translateX(7px);} }

  /* ===== 反馈 ===== */
  .feedback {
    font-size: clamp(18px, 5vw, 30px);
    font-weight: bold;
    height: 1.3em;
    text-align: center;
    flex: 0 0 auto;
  }

  /* ===== 撒花 ===== */
  .confetti {
    position: fixed; top: -20px; font-size: 26px;
    pointer-events: none; animation: fall linear forwards; z-index: 50;
  }
  @keyframes fall { to { transform: translateY(110vh) rotate(360deg); opacity: 0; } }

  /* ===== 返回乐园 ===== */
  .home-btn {
    position: fixed; top: 10px; left: 10px; z-index: 100;
    display: inline-flex; align-items: center; gap: 4px;
    text-decoration: none;
    font-size: clamp(13px, 3.4vw, 16px); font-weight: bold;
    color: #2b6cb0; background: #ffffffcc;
    padding: 7px 13px; border-radius: 999px;
    box-shadow: 0 3px 0 #00000018;
    -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px);
  }
  .home-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #00000018; }
</style>
</head>
<body>
  <a href="index.html" class="home-btn">🏠 乐园</a>
  <h1>🚗 郑直的小汽车十格阵 🚦</h1>

  <div class="bar">
    <div class="seg-group">
      <button class="seg active" id="addMode">➕ 加法</button>
      <button class="seg" id="subMode">➖ 减法</button>
    </div>
    <div class="seg-group">
      <button class="seg active" id="lv5">5 以内</button>
      <button class="seg" id="lv10">10 以内</button>
    </div>
    <div class="voice">
      🔊
      <select id="voiceSelect"></select>
      <button id="testVoice">试听</button>
    </div>
  </div>

  <div class="question" id="question">点「出新题」开始吧！</div>

  <div class="ten-frame" id="frame"></div>

  <div class="controls">
    <button class="big-btn green" id="showBtn">👀 看一看</button>
    <button class="big-btn" id="newBtn">🔄 出新题</button>
  </div>

  <div class="answers" id="answers"></div>

  <div class="feedback" id="feedback"></div>

<script>
/* =======================================================================
   小汽车十格阵 —— 加减法练习
   用十格阵的“满 5 / 凑 10”结构，帮助学前儿童建立数感。
   ======================================================================= */

const frameEl    = document.getElementById('frame');
const questionEl = document.getElementById('question');
const answersEl  = document.getElementById('answers');
const feedbackEl = document.getElementById('feedback');
const showBtn    = document.getElementById('showBtn');
const newBtn     = document.getElementById('newBtn');
const addModeBtn = document.getElementById('addMode');
const subModeBtn = document.getElementById('subMode');
const lv5Btn     = document.getElementById('lv5');
const lv10Btn    = document.getElementById('lv10');
const voiceSelect = document.getElementById('voiceSelect');

const CHILD_NAME = '郑直';
const RED_CAR    = '🚗';
const YELLOW_CAR = '🚕';

let mode  = 'add';     // 'add' 或 'sub'
let level = 5;         // 难度上限：5 或 10
let current = null;
let animating = false;
let runToken = 0;      // 演示代号：换题时自增，使进行中的旧动画回调全部作废，避免串题

/* ---------- 十格阵 ---------- */
function buildFrame() {
  frameEl.innerHTML = '';
  for (let i = 0; i < 10; i++) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    frameEl.appendChild(cell);
  }
}

/* ---------- 语音 ---------- */
let zhVoices = [];
let chosenVoice = null;

function loadVoices() {
  zhVoices = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith('zh'));
  voiceSelect.innerHTML = '';
  if (zhVoices.length === 0) {
    const opt = document.createElement('option');
    opt.textContent = '默认';
    voiceSelect.appendChild(opt);
    chosenVoice = null;
    return;
  }
  zhVoices.forEach((v, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = v.name.replace(/\s*\(.*?\)/, '');
    voiceSelect.appendChild(opt);
  });
  let prefer = zhVoices.findIndex(v => v.localService && /tingting|婷婷|meijia|美佳|female|女/i.test(v.name));
  if (prefer < 0) prefer = zhVoices.findIndex(v => v.localService);
  if (prefer < 0) prefer = 0;
  voiceSelect.value = prefer;
  chosenVoice = zhVoices[prefer];
}
voiceSelect.onchange = () => {
  chosenVoice = zhVoices[voiceSelect.value] || null;
  speak('你好呀，我是数学小老师');
};
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

function speak(text, onEnd) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    if (chosenVoice) u.voice = chosenVoice;
    u.rate  = 0.85;
    u.pitch = 1.0;
    if (onEnd) u.onend = onEnd;
    speechSynthesis.speak(u);
  } catch (e) { if (onEnd) onEnd(); }
}

// 数字读法：算式里 2 读「二」，量词前 2 读「两」
const CN_NUM = ['零','一','二','三','四','五','六','七','八','九','十'];
function cnNum(n)   { return CN_NUM[n] ?? String(n); }
function cnLiang(n) { return n === 2 ? '两' : cnNum(n); }

function speakAsync(text) {
  return new Promise(resolve => {
    let done = false;
    const fin = () => { if (!done) { done = true; resolve(); } };
    speak(text, fin);
    setTimeout(fin, 1200 + text.length * 350);
  });
}

function rnd(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

/* ---------- 出新题 ---------- */
function newQuestion() {
  runToken++;            // 作废进行中的演示，避免旧动画清空/串到新题
  speechSynthesis.cancel();
  animating = false;
  buildFrame();
  feedbackEl.textContent = '';
  answersEl.innerHTML = '';

  if (mode === 'add') {
    const sumMin = level === 10 ? 6 : 2;   // 10 以内聚焦和 6-10，避免与 5 以内重复
    let a, b;
    do {
      a = rnd(1, level - 1);
      b = rnd(1, level - 1);
    } while (a + b > level || a + b < sumMin);
    current = { a, b, answer: a + b };
    questionEl.textContent = `${a} + ${b} = ?`;
    speak(`${cnNum(a)} 加 ${cnNum(b)} 等于几？点看一看`);
  } else {
    const aMin = level === 10 ? 6 : 2;   // 10 以内聚焦 6-10，避免与 5 以内重复
    const a = rnd(aMin, level);
    const b = rnd(1, a - 1);
    current = { a, b, answer: a - b };
    questionEl.textContent = `${a} - ${b} = ?`;
    speak(`${cnNum(a)} 减 ${cnNum(b)} 等于几？点看一看`);
  }
  buildAnswerButtons();
}

/* ---------- 答案按钮 ---------- */
function buildAnswerButtons() {
  answersEl.innerHTML = '';
  for (let n = 0; n <= 10; n++) {
    const btn = document.createElement('button');
    btn.className = 'num-btn';
    btn.textContent = n;
    btn.onclick = () => checkAnswer(n, btn);
    answersEl.appendChild(btn);
  }
}

/* ---------- 放车 / 开走 ---------- */
function placeCar(index, emoji, delay, token) {
  return new Promise(resolve => {
    setTimeout(() => {
      if (token !== runToken) { resolve(); return; }   // 已换题，放弃操作
      frameEl.children[index].innerHTML = `<span class="car">${emoji}</span>`;
      resolve();
    }, delay);
  });
}

function driveAway(indices, delay, token) {
  const STEP = 550, DRIVE = 1100;
  return new Promise(resolve => {
    setTimeout(() => {
      if (token !== runToken) { resolve(); return; }
      indices.forEach((idx, k) => {
        setTimeout(() => {
          if (token !== runToken) return;
          const car = frameEl.children[idx].querySelector('.car');
          if (car) car.classList.add('leaving');
        }, k * STEP);
      });
      const total = (indices.length - 1) * STEP + DRIVE;
      setTimeout(() => {
        if (token !== runToken) { resolve(); return; }   // 关键：换题后绝不清空新题的格子
        indices.forEach(i => { frameEl.children[i].innerHTML = ''; });
        resolve();
      }, total);
    }, delay);
  });
}

/* ---------- 看一看 ---------- */
async function showDemo() {
  if (!current || animating) return;
  const token = ++runToken;   // 本次演示的代号
  animating = true;
  buildFrame();
  feedbackEl.textContent = '';

  if (mode === 'add') {
    const { a, b } = current;
    await Promise.all([
      (async () => { for (let i = 0; i < a; i++) await placeCar(i, RED_CAR, i === 0 ? 0 : 280, token); })(),
      speakAsync(`先开来${cnLiang(a)}辆`)
    ]);
    if (token !== runToken) { animating = false; return; }
    await Promise.all([
      (async () => { for (let i = 0; i < b; i++) await placeCar(a + i, YELLOW_CAR, 280, token); })(),
      speakAsync(`又开来${cnLiang(b)}辆，一共几辆呀`)
    ]);
  } else {
    const { a, b } = current;
    await Promise.all([
      (async () => { for (let i = 0; i < a; i++) await placeCar(i, RED_CAR, i === 0 ? 0 : 300, token); })(),
      speakAsync(`先停了${cnLiang(a)}辆`)
    ]);
    if (token !== runToken) { animating = false; return; }
    await new Promise(r => setTimeout(r, 600));
    const leaving = [];
    for (let i = a - 1; i >= a - b; i--) leaving.push(i); // 从最右（出口侧）一辆辆往左开走
    await Promise.all([
      driveAway(leaving, 0, token),
      speakAsync(`开走了${cnLiang(b)}辆，还剩几辆呀`)
    ]);
  }
  if (token === runToken) animating = false;
}

/* ---------- 判题 ---------- */
function checkAnswer(n, btn) {
  if (!current) return;
  if (n === current.answer) {
    btn.classList.add('correct');
    [...answersEl.children].forEach(b => b.disabled = true);
    const op   = mode === 'add' ? '加' : '减';
    const sign = mode === 'add' ? '+' : '-';
    questionEl.innerHTML = `${current.a} ${sign} ${current.b} = <span class="ans">${current.answer}</span>`;
    feedbackEl.textContent = `🎉 ${CHILD_NAME}太棒了！`;
    feedbackEl.style.color = '#2e7031';
    celebrate();
    let advanced = false;
    const myToken = runToken;   // 绑定本题代号：一旦换题（手动出新题/切模式难度），兜底回调失效，避免自动多跳
    const goNext = () => { if (advanced || myToken !== runToken) return; advanced = true; setTimeout(newQuestion, 700); };
    speak(`${CHILD_NAME}答对了！${cnNum(current.a)} ${op} ${cnNum(current.b)} 等于 ${cnNum(current.answer)}`, goNext);
    setTimeout(goNext, 7000);
  } else {
    btn.classList.add('wrong');
    feedbackEl.textContent = `🤔 ${CHILD_NAME}再数一数试试～`;
    feedbackEl.style.color = '#c62828';
    speak(`${CHILD_NAME}再数一数试试`);
    setTimeout(() => btn.classList.remove('wrong'), 500);
  }
}

/* ---------- 撒花 ---------- */
function celebrate() {
  const emojis = ['🎉','⭐','🚗','🎈','🌟','🏎️','✨'];
  for (let i = 0; i < 24; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.animationDuration = (1.5 + Math.random() * 1.5) + 's';
    c.style.fontSize = (20 + Math.random() * 20) + 'px';
    document.body.appendChild(c);
    setTimeout(() => c.remove(), 3000);
  }
}

/* ---------- 模式 / 难度切换 ---------- */
function setMode(m) {
  mode = m;
  addModeBtn.classList.toggle('active', m === 'add');
  subModeBtn.classList.toggle('active', m === 'sub');
  newQuestion();
}
function setLevel(n) {
  level = n;
  lv5Btn.classList.toggle('active', n === 5);
  lv10Btn.classList.toggle('active', n === 10);
  newQuestion();
}

/* ---------- 事件绑定 ---------- */
showBtn.onclick    = showDemo;
newBtn.onclick     = newQuestion;
addModeBtn.onclick = () => setMode('add');
subModeBtn.onclick = () => setMode('sub');
lv5Btn.onclick     = () => setLevel(5);
lv10Btn.onclick    = () => setLevel(10);
document.getElementById('testVoice').onclick = () => speak(`${CHILD_NAME}你好呀，我们一起来数小汽车吧！`);

/* ---------- 启动 ---------- */
buildFrame();
newQuestion();
</script>
</body>
</html>
