<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🐹 打地鼠 · 小朋友练反应</title>
<style>
  :root { --shadow: rgba(0,0,0,.16); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #c5e1a5, #fff59d);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 12px 24px; color: #558b2f; user-select: none;
  }
  h1 { font-size: clamp(22px, 5.6vw, 38px); margin: 2px 0; text-shadow: 2px 2px 0 #fff; text-align: center; }
  .tip {
    font-size: clamp(15px, 3.6vw, 20px); margin: 8px 0; background: #fff;
    padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 10px var(--shadow);
    min-height: 1.4em; text-align: center; color: #455a64; max-width: 92vw;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .pick-btn {
    font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; padding: 8px 14px;
    border: none; border-radius: 16px; background: #fff; color: #689f38;
    cursor: pointer; box-shadow: 0 4px 0 #c5e1a5; transition: transform .08s, background .2s;
  }
  .pick-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c5e1a5; }
  .pick-btn.active { background: #8bc34a; box-shadow: 0 4px 0 #558b2f; color: #fff; }

  .hud { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; margin: 4px 0 10px; }
  .chip {
    background: #fff; padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 8px var(--shadow);
    font-size: clamp(15px, 4vw, 20px); font-weight: 800;
  }
  .chip .v { color: #e91e63; }

  #field {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: clamp(8px, 3vw, 16px);
    width: min(86vw, 360px); margin: 4px 0 14px;
  }
  .hole {
    aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 50% 38%, #a1887f 0%, #6d4c37 70%, #4e342e 100%);
    box-shadow: inset 0 8px 14px rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(34px, 11vw, 56px); cursor: pointer; overflow: hidden; line-height: 1;
  }
  .hole .critter { transform: translateY(120%); transition: transform .12s; }
  .hole.up .critter { transform: translateY(0); }
  .hole.bonk { animation: bonk .25s; }
  @keyframes bonk { 0%{transform:scale(1)} 50%{transform:scale(.88)} 100%{transform:scale(1)} }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tool-btn {
    font-size: clamp(16px, 4.4vw, 21px); font-weight: 700; padding: 12px 26px;
    border: none; border-radius: 16px; background: #ff7043; color: #fff;
    cursor: pointer; box-shadow: 0 5px 0 #d84315;
  }
  .tool-btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #d84315; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .star { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
</style>
</head>
<body>
  <h1>🐹 郑直的打地鼠 🔨</h1>
  <div class="tip" id="tip">地鼠冒出来就快点它！💣 炸弹千万别碰～</div>

  <div class="row" id="levels">
    <button class="pick-btn active" data-l="easy">🐣 慢慢来</button>
    <button class="pick-btn" data-l="mid">🐰 快一点</button>
    <button class="pick-btn" data-l="hard">🦁 有炸弹</button>
  </div>

  <div class="hud">
    <div class="chip">🏆 得分 <span class="v" id="scoreText">0</span></div>
    <div class="chip">⏱ <span class="v" id="timeText">30</span> 秒</div>
    <div class="chip">🥇 最高 <span class="v" id="bestText">0</span></div>
  </div>

  <div id="field"></div>

  <div class="tools">
    <button class="tool-btn" id="startBtn">▶️ 开始</button>
  </div>

  <div id="confetti"></div>

<script>
/* =======================================================================
   打地鼠 —— 反应力训练
   地鼠随机冒出，限时内快速点中得分；挑战难度会出现炸弹（别点）。
   锻炼学前儿童的反应速度、手眼协调与专注力。
   ======================================================================= */

const CHILD_NAME = "郑直";
const HOLES = 9;
const GAME_TIME = 30;

const LEVELS = {
  easy: { spawn: 950, up: 1150, bomb: 0 },
  mid:  { spawn: 720, up: 880,  bomb: 0 },
  hard: { spawn: 560, up: 720,  bomb: 0.28 },
};

let level = "easy";
let score = 0;
let timeLeft = GAME_TIME;
let running = false;
let holeState = [];       // 每个洞：null | 'mole' | 'bomb'
let spawnTimer = null;
let countTimer = null;
let hideTimers = [];

// ---------- 音效 ----------
let actx = null;
function ensureCtx() { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); return actx; }
function beep(freq, dur = 0.1, type = "sine", vol = 0.16) {
  try {
    const ctx = ensureCtx();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(vol, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    o.start(); o.stop(ctx.currentTime + dur);
  } catch (e) {}
}
function playWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.2), i * 150)); }

// ---------- 语音 ----------
let chosenVoice = null;
function loadVoices() {
  const zh = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
  let p = zh.findIndex(v => v.localService && /tingting|婷婷|meijia|美佳|female|女/i.test(v.name));
  if (p < 0) p = zh.findIndex(v => v.localService);
  if (p < 0) p = 0;
  chosenVoice = zh[p] || null;
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (chosenVoice) u.voice = chosenVoice;
    u.rate = 0.98; u.pitch = 1.05; speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- 建场 ----------
function buildField() {
  const field = document.getElementById("field");
  field.innerHTML = "";
  holeState = new Array(HOLES).fill(null);
  for (let i = 0; i < HOLES; i++) {
    const h = document.createElement("div");
    h.className = "hole";
    h.dataset.i = i;
    h.innerHTML = `<span class="critter"></span>`;
    h.onclick = () => onHit(i, h);
    field.appendChild(h);
  }
}

// ---------- 冒出 ----------
function spawn() {
  // 找空洞
  const empty = [];
  holeState.forEach((s, i) => { if (!s) empty.push(i); });
  if (!empty.length) return;
  const i = empty[Math.floor(Math.random() * empty.length)];
  const isBomb = Math.random() < LEVELS[level].bomb;
  holeState[i] = isBomb ? "bomb" : "mole";
  const h = document.querySelector(`.hole[data-i="${i}"]`);
  h.querySelector(".critter").textContent = isBomb ? "💣" : "🐹";
  h.classList.add("up");
  const t = setTimeout(() => hide(i), LEVELS[level].up);
  hideTimers.push(t);
}
function hide(i) {
  holeState[i] = null;
  const h = document.querySelector(`.hole[data-i="${i}"]`);
  if (h) { h.classList.remove("up"); }
}

// ---------- 敲击 ----------
function onHit(i, h) {
  if (!running) return;
  const s = holeState[i];
  if (!s) return;                 // 空洞，不计
  if (s === "mole") {
    score++;
    beep(720, 0.08);
    h.classList.add("bonk");
    setTimeout(() => h.classList.remove("bonk"), 250);
  } else { // 炸弹
    score = Math.max(0, score - 1);
    beep(140, 0.25, "square");
    h.classList.add("bonk");
    setTimeout(() => h.classList.remove("bonk"), 250);
  }
  hide(i);
  document.getElementById("scoreText").textContent = score;
}

// ---------- 开始 / 结束 ----------
function start() {
  ensureCtx();
  clearAll();
  buildField();
  score = 0; timeLeft = GAME_TIME; running = true;
  document.getElementById("scoreText").textContent = "0";
  document.getElementById("timeText").textContent = timeLeft;
  document.getElementById("startBtn").textContent = "🔄 重新开始";
  showBest();
  setTip("快！地鼠冒出来就敲它！🔨");
  speak("预备，开始！");
  spawnTimer = setInterval(spawn, LEVELS[level].spawn);
  countTimer = setInterval(() => {
    timeLeft--;
    document.getElementById("timeText").textContent = timeLeft;
    if (timeLeft <= 0) end();
  }, 1000);
}
function clearAll() {
  if (spawnTimer) clearInterval(spawnTimer);
  if (countTimer) clearInterval(countTimer);
  hideTimers.forEach(t => clearTimeout(t));
  hideTimers = [];
  spawnTimer = countTimer = null;
}
function end() {
  running = false;
  clearAll();
  document.querySelectorAll(".hole.up").forEach(h => h.classList.remove("up"));
  holeState = holeState.map(() => null);
  const prev = getBest();
  let msg = `时间到！你打中了 ${score} 只地鼠 🐹`;
  if (score > prev) { setBest(score); msg += "　破纪录啦！🥇"; }
  showBest();
  setTip(msg);
  playWin(); confetti();
  speak(`时间到！${CHILD_NAME}打中了 ${score} 只地鼠`);
}

// ---------- 最佳分（按难度，存本地） ----------
function bestKey() { return "mole_best_" + level; }
function getBest() { try { return parseInt(localStorage.getItem(bestKey()) || "0", 10); } catch (e) { return 0; } }
function setBest(v) { try { localStorage.setItem(bestKey(), String(v)); } catch (e) {} }
function showBest() { document.getElementById("bestText").textContent = getBest(); }

// ---------- 撒花 ----------
function confetti() {
  const box = document.getElementById("confetti");
  const emojis = ["🌟","🎉","⭐","🐹","🎈","💖","✨","🔨"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 3500);
  }
}

function setTip(t) { document.getElementById("tip").textContent = t; }

// ---------- 事件 ----------
document.getElementById("levels").addEventListener("click", e => {
  const btn = e.target.closest(".pick-btn"); if (!btn) return;
  document.querySelectorAll("#levels .pick-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  level = btn.dataset.l; beep(520, 0.1);
  clearAll(); running = false;
  document.getElementById("startBtn").textContent = "▶️ 开始";
  document.getElementById("timeText").textContent = GAME_TIME;
  document.getElementById("scoreText").textContent = "0";
  showBest();
  setTip(level === "hard" ? "这一关有炸弹💣，只敲地鼠🐹！" : "地鼠冒出来就快点它！");
});
document.getElementById("startBtn").onclick = start;

// 启动
buildField();
showBest();
</script>
</body>
</html>
