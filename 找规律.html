<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🧩 找规律 · 小朋友学思维</title>
<style>
  :root { --shadow: rgba(0,0,0,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #fff1c1, #c7f5e0);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 12px 24px; color: #00695c; user-select: none;
  }
  h1 { font-size: clamp(22px, 5.6vw, 38px); margin: 2px 0; text-shadow: 2px 2px 0 #fff; text-align: center; }
  .tip {
    font-size: clamp(15px, 3.6vw, 20px); margin: 8px 0; background: #fff;
    padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 10px var(--shadow);
    min-height: 1.4em; text-align: center; color: #455a64; max-width: 92vw;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .pick-btn {
    font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; padding: 8px 14px;
    border: none; border-radius: 16px; background: #fff; color: #00897b;
    cursor: pointer; box-shadow: 0 4px 0 #b2dfdb; transition: transform .08s, background .2s;
  }
  .pick-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b2dfdb; }
  .pick-btn.active { background: #26a69a; box-shadow: 0 4px 0 #00796b; color: #fff; }

  /* 序列 */
  .seq {
    display: flex; gap: clamp(4px, 1.6vw, 9px); justify-content: center;
    flex-wrap: nowrap; overflow-x: auto; max-width: 96vw;
    background: #fff; padding: 12px clamp(8px,2vw,14px); border-radius: 20px;
    box-shadow: 0 6px 18px var(--shadow); margin: 8px 0 6px;
  }
  .slot {
    flex: 0 0 auto;
    width: clamp(38px, 12vw, 58px); height: clamp(38px, 12vw, 58px);
    border-radius: 14px; background: #f1f8f6;
    display: flex; align-items: center; justify-content: center;
    font-size: clamp(26px, 9vw, 42px); line-height: 1;
  }
  .slot.qmark {
    background: #fff59d; border: 3px dashed #fbc02d; color: #f57f17;
    font-weight: 800; animation: pulse 1.2s infinite;
  }
  .slot.filled { background: #c8f7c5; animation: pop .5s; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

  .arrow { font-size: clamp(20px, 6vw, 30px); color: #00897b; margin: 2px 0 8px; }

  /* 选项 */
  .options { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: min(92vw, 420px); }
  .opt {
    width: clamp(60px, 18vw, 84px); height: clamp(60px, 18vw, 84px);
    border: none; border-radius: 18px; cursor: pointer; background: #fff;
    box-shadow: 0 5px 0 #00000018; font-size: clamp(34px, 11vw, 50px); line-height: 1;
    transition: transform .08s;
  }
  .opt:active { transform: translateY(3px); }
  .opt.correct { background: #66bb6a; animation: pop .5s; }
  .opt.wrong { background: #ef9a9a; animation: shake .35s; }
  .opt:disabled { opacity: .6; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  .score { font-size: clamp(16px, 4.2vw, 21px); font-weight: 800; color: #f57f17; margin: 10px 0 0; }
  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 12px; }
  .tool-btn {
    font-size: clamp(15px, 4vw, 19px); font-weight: 700; padding: 11px 22px;
    border: none; border-radius: 16px; background: #80d8ff; color: #01579b;
    cursor: pointer; box-shadow: 0 4px 0 #4fc3f7;
  }
  .tool-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #4fc3f7; }
  .tool-btn.speak { background: #ffd54f; color: #6d4c41; box-shadow: 0 4px 0 #f9a825; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .star { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
</style>
</head>
<body>
  <a id="backHome" href="index.html" style="position:fixed;top:10px;left:10px;z-index:9999;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:rgba(94,53,177,.85);padding:8px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);-webkit-tap-highlight-color:transparent;">⬅️ 返回</a>
  <h1>🧩 郑直的找规律 🔍</h1>
  <div class="tip" id="tip">看看小图案排队的规律，接下来该轮到谁啦？</div>

  <div class="row" id="themes">
    <button class="pick-btn active" data-t="shape">🔵 形状</button>
    <button class="pick-btn" data-t="fruit">🍎 水果</button>
    <button class="pick-btn" data-t="animal">🐶 动物</button>
  </div>
  <div class="row" id="levels">
    <button class="pick-btn active" data-l="easy">🐣 简单</button>
    <button class="pick-btn" data-l="mid">🐰 普通</button>
    <button class="pick-btn" data-l="hard">🦁 挑战</button>
  </div>

  <div class="seq" id="seq"></div>
  <div class="arrow">⬆️ 接下来是哪个？</div>
  <div class="options" id="options"></div>

  <div class="score" id="score">🌟 连对 0 个</div>

  <div class="tools">
    <button class="tool-btn speak" id="speakBtn">🔊 读一遍</button>
    <button class="tool-btn" id="newBtn">🔄 换一题</button>
  </div>

  <div id="confetti"></div>

<script>
/* =======================================================================
   找规律 —— 模式推理（思维锻炼）
   按 ABAB / ABCABC / AABB 等规律排列图案，让孩子推断下一个是什么。
   锻炼 5 岁儿童的观察、归纳与逻辑推理能力。
   ======================================================================= */

const CHILD_NAME = "郑直";

const THEMES = {
  shape:  ["🔴","🔵","🟡","🟢","🟣","🟠"],
  fruit:  ["🍎","🍌","🍇","🍓","🍊","🍉"],
  animal: ["🐶","🐱","🐰","🐸","🐭","🦊"],
};
// 规律模板（字母表示循环单元），按难度区分
const PATTERNS = {
  easy: ["AB", "AAB", "ABB"],
  mid:  ["ABC", "AABB", "ABBA"],
  hard: ["ABCD", "AABBCC", "ABCCBA"],
};

let theme = "shape";
let level = "easy";
let answer = null;     // 正确的下一个图案
let locked = false;
let streak = 0;

// ---------- 音效 ----------
let actx = null;
function beep(freq, dur = 0.12, type = "sine", vol = 0.15) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function playWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.2), i * 150)); }

// ---------- 语音 ----------
let chosenVoice = null;
function loadVoices() {
  const zh = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
  let p = zh.findIndex(v => v.localService && /tingting|婷婷|meijia|美佳|female|女/i.test(v.name));
  if (p < 0) p = zh.findIndex(v => v.localService);
  if (p < 0) p = 0;
  chosenVoice = zh[p] || null;
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (chosenVoice) u.voice = chosenVoice;
    u.rate = 0.9; u.pitch = 1.05; speechSynthesis.speak(u);
  } catch (e) {}
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

const DISPLAY = 6;   // 展示 6 个，第 7 个让孩子猜

// ---------- 出新题 ----------
function newQuestion() {
  locked = false;
  const pat = pick(PATTERNS[level]);
  const letters = [...new Set(pat)];
  const pool = shuffle([...THEMES[theme]]);
  const map = {};
  letters.forEach((L, i) => map[L] = pool[i]);
  const unit = [...pat].map(L => map[L]);

  // 循环填满到 DISPLAY+1，前 DISPLAY 个展示，最后一个是答案
  const full = [];
  for (let i = 0; i <= DISPLAY; i++) full.push(unit[i % unit.length]);
  const display = full.slice(0, DISPLAY);
  answer = full[DISPLAY];
  const options = shuffle(letters.map(L => map[L]));

  // 渲染序列
  const seqEl = document.getElementById("seq");
  seqEl.innerHTML = "";
  display.forEach(em => {
    const d = document.createElement("div");
    d.className = "slot";
    d.textContent = em;
    seqEl.appendChild(d);
  });
  const q = document.createElement("div");
  q.className = "slot qmark";
  q.textContent = "?";
  q.id = "qslot";
  seqEl.appendChild(q);

  // 渲染选项
  const optEl = document.getElementById("options");
  optEl.innerHTML = "";
  options.forEach(em => {
    const b = document.createElement("button");
    b.className = "opt";
    b.textContent = em;
    b.onclick = () => check(em, b);
    optEl.appendChild(b);
  });

  setTip("看看排队的规律，接下来该轮到谁啦？");
  speak("看看图案排队的规律，接下来是哪个呀？");
}

// ---------- 判题 ----------
function check(em, btn) {
  if (locked) return;
  if (em === answer) {
    locked = true;
    btn.classList.add("correct");
    [...document.getElementById("options").children].forEach(b => b.disabled = true);
    const q = document.getElementById("qslot");
    q.textContent = answer; q.classList.remove("qmark"); q.classList.add("filled");
    streak++;
    document.getElementById("score").textContent = `🌟 连对 ${streak} 个`;
    setTip("规律找对啦！你真聪明 🎉", "#c8f7c5");
    beep(660, 0.12, "triangle"); playWin(); confetti();
    speak(`${CHILD_NAME}找对啦！`);
    setTimeout(newQuestion, 1900);
  } else {
    btn.classList.add("wrong");
    beep(220, 0.12, "square");
    streak = 0;
    document.getElementById("score").textContent = `🌟 连对 ${streak} 个`;
    setTip("再数一数前面的规律，试一次 🤔");
    speak("再看看前面的规律");
    setTimeout(() => { btn.classList.remove("wrong"); btn.disabled = false; }, 500);
    btn.disabled = true;
  }
}

// ---------- 撒花 ----------
function confetti() {
  const box = document.getElementById("confetti");
  const emojis = ["🌟","🎉","⭐","🧩","🎈","💖","✨"].concat(THEMES[theme]);
  for (let i = 0; i < 34; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 3500);
  }
}

function setTip(t, bg) {
  const el = document.getElementById("tip");
  el.textContent = t;
  el.style.background = bg || "#fff";
}

// ---------- 事件 ----------
document.getElementById("themes").addEventListener("click", e => {
  const btn = e.target.closest(".pick-btn"); if (!btn) return;
  document.querySelectorAll("#themes .pick-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  theme = btn.dataset.t; beep(600, 0.1); newQuestion();
});
document.getElementById("levels").addEventListener("click", e => {
  const btn = e.target.closest(".pick-btn"); if (!btn) return;
  document.querySelectorAll("#levels .pick-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  level = btn.dataset.l; beep(520, 0.1); newQuestion();
});
document.getElementById("speakBtn").onclick = () => speak("看看图案排队的规律，接下来是哪个呀？");
document.getElementById("newBtn").onclick = () => { beep(520, 0.1); newQuestion(); };

// 启动
newQuestion();
</script>
</body>
</html>
