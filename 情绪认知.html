<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>😊 情绪认知 · 小朋友认表情</title>
<style>
  :root { --shadow: rgba(0,0,0,.14); --right: #66bb6a; --wrong: #ef5350; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #fff6c8, #ffd9e6);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 12px 24px; color: #ad1457; user-select: none;
  }
  h1 { font-size: clamp(22px, 5.6vw, 38px); margin: 2px 0; text-shadow: 2px 2px 0 #fff; text-align: center; }
  .tip {
    font-size: clamp(15px, 3.6vw, 20px); margin: 8px 0; background: #fff;
    padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 10px var(--shadow);
    min-height: 1.4em; text-align: center; color: #455a64; max-width: 92vw;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .pick-btn {
    font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; padding: 8px 14px;
    border: none; border-radius: 16px; background: #fff; color: #d81b60;
    cursor: pointer; box-shadow: 0 4px 0 #f3b6cd; transition: transform .08s, background .2s;
  }
  .pick-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #f3b6cd; }
  .pick-btn.active { background: #ec407a; box-shadow: 0 4px 0 #ad1457; color: #fff; }

  .stage {
    background: #fff; border-radius: 26px; box-shadow: 0 8px 22px var(--shadow);
    padding: 16px 24px; margin: 8px 0 14px; text-align: center; min-width: min(74vw, 280px);
  }
  .stage .big-face { font-size: clamp(78px, 24vw, 140px); line-height: 1.05; cursor: pointer; }
  .stage .big-word { font-size: clamp(40px, 13vw, 72px); font-weight: 800; color: #d81b60; line-height: 1.1; }
  .stage .pinyin { font-size: clamp(18px, 4.6vw, 26px); color: #1e88e5; font-weight: 700; }
  .stage .hint-q { font-size: clamp(16px, 4vw, 22px); color: #607d8b; margin-top: 6px; }

  .options { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: min(92vw, 420px); }
  .opt {
    border: none; border-radius: 18px; cursor: pointer; background: #fff;
    box-shadow: 0 5px 0 #00000018; padding: 14px 8px; transition: transform .08s;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
  }
  .opt:active { transform: translateY(3px); }
  .opt .o-word { font-size: clamp(24px, 7vw, 34px); font-weight: 800; color: #4e342e; line-height: 1.1; }
  .opt .o-pin { font-size: clamp(12px, 3.2vw, 16px); color: #1e88e5; font-weight: 700; }
  .opt .o-face { font-size: clamp(44px, 13vw, 64px); line-height: 1; }
  .opt.correct { background: var(--right); }
  .opt.correct .o-word, .opt.correct .o-pin { color: #fff; }
  .opt.correct { animation: pop .5s; }
  .opt.wrong { background: var(--wrong); animation: shake .35s; }
  .opt.wrong .o-word, .opt.wrong .o-pin { color: #fff; }
  .opt:disabled { opacity: .6; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.16)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 14px; }
  .tool-btn {
    font-size: clamp(15px, 4vw, 19px); font-weight: 700; padding: 11px 22px;
    border: none; border-radius: 16px; background: #ffd54f; color: #6d4c41;
    cursor: pointer; box-shadow: 0 4px 0 #f9a825;
  }
  .tool-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #f9a825; }
  .score { font-size: clamp(16px, 4.2vw, 21px); font-weight: 800; color: #f57f17; margin-top: 10px; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .star { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
</style>
</head>
<body>
  <a id="backHome" href="index.html" style="position:fixed;top:10px;left:10px;z-index:9999;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:rgba(94,53,177,.85);padding:8px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);-webkit-tap-highlight-color:transparent;">⬅️ 返回</a>
  <h1>😊 郑直的情绪认知 💗</h1>
  <div class="tip" id="tip">看看这张脸，它现在是什么心情呀？</div>

  <div class="row" id="modes">
    <button class="pick-btn active" data-m="face2word">🙂 看脸认情绪</button>
    <button class="pick-btn" data-m="word2face">🔤 听词找表情</button>
  </div>

  <div class="stage" id="stage"></div>
  <div class="options" id="options"></div>

  <div class="tools">
    <button class="tool-btn" id="speakBtn">🔊 再读一遍</button>
    <button class="tool-btn" id="newBtn">🔄 换一题</button>
  </div>
  <div class="score" id="score">🌟 认对 0 个</div>

  <div id="confetti"></div>

<script>
/* =======================================================================
   情绪认知 —— 认识表情与心情
   看脸认情绪 / 听词找表情 两种模式，答对后讲一句“什么时候会这样”。
   锻炼学前儿童的情绪识别与社交认知。
   ======================================================================= */

const CHILD_NAME = "郑直";

// 情绪库：face 表情, name 中文, p 拼音, scene 情境句
const EMO = [
  { face: "😀", name: "开心", p: "kāi xīn", scene: "得到喜欢的礼物时" },
  { face: "😢", name: "难过", p: "nán guò", scene: "心爱的玩具坏了时" },
  { face: "😡", name: "生气", p: "shēng qì", scene: "东西被抢走时" },
  { face: "😨", name: "害怕", p: "hài pà", scene: "听到打雷的声音时" },
  { face: "😲", name: "惊讶", p: "jīng yà", scene: "看到大大的惊喜时" },
  { face: "😴", name: "困了", p: "kùn le", scene: "玩累了想睡觉时" },
  { face: "🥰", name: "喜欢", p: "xǐ huān", scene: "抱着软软的小猫时" },
  { face: "😅", name: "不好意思", p: "bù hǎo yì si", scene: "做错小事被发现时" },
];

let mode = "face2word";   // face2word | word2face
let target = null;
let locked = false;
let score = 0;

// ---------- 音效 ----------
let actx = null;
function beep(freq, dur = 0.12, type = "sine", vol = 0.15) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function playWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.2), i * 150)); }

// ---------- 语音 ----------
let chosenVoice = null;
function loadVoices() {
  const zh = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
  let p = zh.findIndex(v => v.localService && /tingting|婷婷|meijia|美佳|female|女/i.test(v.name));
  if (p < 0) p = zh.findIndex(v => v.localService);
  if (p < 0) p = 0;
  chosenVoice = zh[p] || null;
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (chosenVoice) u.voice = chosenVoice;
    u.rate = 0.88; u.pitch = 1.05; speechSynthesis.speak(u);
  } catch (e) {}
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- 出新题 ----------
function newQuestion() {
  locked = false;
  target = EMO[Math.floor(Math.random() * EMO.length)];
  const distractors = shuffle(EMO.filter(e => e.name !== target.name)).slice(0, 3);
  const opts = shuffle([target, ...distractors]);

  const stage = document.getElementById("stage");
  const box = document.getElementById("options");
  box.innerHTML = "";

  if (mode === "face2word") {
    stage.innerHTML = `<div class="big-face" id="bigFace">${target.face}</div>
                       <div class="hint-q">它现在是什么心情？</div>`;
    document.getElementById("bigFace").onclick = () => speak("它是什么心情呀");
    opts.forEach(e => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span class="o-word">${e.name}</span><span class="o-pin">${e.p}</span>`;
      b.onclick = () => check(e, b);
      box.appendChild(b);
    });
    setTip("看看这张脸，它现在是什么心情呀？");
    speak("它现在是什么心情呀？");
  } else {
    stage.innerHTML = `<div class="big-word">${target.name}</div>
                       <div class="pinyin">${target.p}</div>
                       <div class="hint-q">哪张脸是这个心情？</div>`;
    opts.forEach(e => {
      const b = document.createElement("button");
      b.className = "opt";
      b.innerHTML = `<span class="o-face">${e.face}</span>`;
      b.onclick = () => check(e, b);
      box.appendChild(b);
    });
    setTip(`找一找：哪张脸是「${target.name}」？`);
    speak(`哪张脸是${target.name}？`);
  }
}

// ---------- 判题 ----------
function check(e, btn) {
  if (locked) return;
  if (e.name === target.name) {
    locked = true;
    btn.classList.add("correct");
    [...document.getElementById("options").children].forEach(b => b.disabled = true);
    score++;
    document.getElementById("score").textContent = `🌟 认对 ${score} 个`;
    setTip(`答对啦！${target.face} 是${target.name}，${target.scene}会这样 💗`, "#c8f7c5");
    beep(660, 0.12, "triangle"); playWin(); confetti();
    speak(`答对了！这是${target.name}。${target.scene}，就会${target.name}`);
    setTimeout(newQuestion, 2600);
  } else {
    btn.classList.add("wrong");
    beep(220, 0.12, "square");
    setTip("再看看这张脸，猜猜看 🤔");
    speak("再看看，猜一猜");
    setTimeout(() => { btn.classList.remove("wrong"); btn.disabled = false; }, 500);
    btn.disabled = true;
  }
}

// ---------- 撒花 ----------
function confetti() {
  const box = document.getElementById("confetti");
  const emojis = ["🌟","🎉","⭐","💗","🎈","💖","✨","😊"];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 3500);
  }
}

function setTip(t, bg) {
  const el = document.getElementById("tip");
  el.textContent = t;
  el.style.background = bg || "#fff";
}

// ---------- 朗读当前题 ----------
function speakCurrent() {
  if (!target) return;
  if (mode === "face2word") speak("它现在是什么心情呀？");
  else speak(`哪张脸是${target.name}？`);
}

// ---------- 事件 ----------
document.getElementById("modes").addEventListener("click", e => {
  const btn = e.target.closest(".pick-btn"); if (!btn) return;
  document.querySelectorAll("#modes .pick-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  mode = btn.dataset.m; beep(600, 0.1); newQuestion();
});
document.getElementById("speakBtn").onclick = speakCurrent;
document.getElementById("newBtn").onclick = () => { beep(520, 0.1); newQuestion(); };

// 启动
newQuestion();
</script>
</body>
</html>
