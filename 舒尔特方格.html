<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🔢 舒尔特方格 · 小朋友练专注</title>
<style>
  :root { --shadow: rgba(0,0,0,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #d7eaff, #ffe2f0);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 12px 24px; color: #1565c0; user-select: none;
  }
  h1 { font-size: clamp(22px, 5.6vw, 38px); margin: 2px 0; text-shadow: 2px 2px 0 #fff; text-align: center; }
  .tip {
    font-size: clamp(15px, 3.6vw, 20px); margin: 8px 0; background: #fff;
    padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 10px var(--shadow);
    min-height: 1.4em; text-align: center; color: #455a64; max-width: 92vw;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .pick-btn {
    font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; padding: 8px 14px;
    border: none; border-radius: 16px; background: #fff; color: #1976d2;
    cursor: pointer; box-shadow: 0 4px 0 #b3d4f5; transition: transform .08s, background .2s;
  }
  .pick-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #b3d4f5; }
  .pick-btn.active { background: #2196f3; box-shadow: 0 4px 0 #1565c0; color: #fff; }

  .hud { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; align-items: center; margin: 4px 0 10px; }
  .chip {
    background: #fff; padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 8px var(--shadow);
    font-size: clamp(15px, 4vw, 20px); font-weight: 800;
  }
  .chip .next { color: #e91e63; font-size: 1.25em; }

  #grid { display: grid; gap: clamp(5px, 1.6vw, 9px); margin: 4px 0 14px; }
  .cell {
    aspect-ratio: 1; border-radius: 14px; background: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; color: #37474f; cursor: pointer;
    box-shadow: 0 4px 0 #00000015; transition: transform .07s, background .15s;
  }
  .cell:active { transform: translateY(3px); }
  .cell.done { background: #a5d6a7; color: #1b5e20; box-shadow: none; opacity: .8; }
  .cell.wrong { background: #ef9a9a; animation: shake .35s; }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)} }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.2)} 100%{transform:scale(1)} }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tool-btn {
    font-size: clamp(15px, 4vw, 19px); font-weight: 700; padding: 11px 22px;
    border: none; border-radius: 16px; background: #a5d6a7; color: #1b5e20;
    cursor: pointer; box-shadow: 0 4px 0 #81c784;
  }
  .tool-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #81c784; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .star { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
</style>
</head>
<body>
  <a id="backHome" href="index.html" style="position:fixed;top:10px;left:10px;z-index:9999;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:rgba(94,53,177,.85);padding:8px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);-webkit-tap-highlight-color:transparent;">⬅️ 返回</a>
  <h1>🔢 郑直的舒尔特方格 🎯</h1>
  <div class="tip" id="tip">从 1 开始，按顺序一个一个点下去！</div>

  <div class="row" id="levels">
    <button class="pick-btn" data-n="2">🐣 2×2</button>
    <button class="pick-btn active" data-n="3">🐰 3×3</button>
    <button class="pick-btn" data-n="4">🦁 4×4</button>
    <button class="pick-btn" data-n="5">🏆 5×5</button>
  </div>

  <div class="hud">
    <div class="chip">找：<span class="next" id="nextNum">1</span></div>
    <div class="chip">⏱ <span id="timeText">0.0</span> 秒</div>
    <div class="chip">🏅 最快 <span id="bestText">—</span></div>
  </div>

  <div id="grid"></div>

  <div class="tools">
    <button class="tool-btn" id="newBtn">🔄 重新开始</button>
  </div>

  <div id="confetti"></div>

<script>
/* =======================================================================
   舒尔特方格 —— 专注力训练
   在打乱的数字方格里，按 1→N² 顺序依次点击。
   锻炼学前儿童的注意力广度、视觉搜索速度与专注力。
   ======================================================================= */

const CHILD_NAME = "郑直";
let N = 3;
let nums = [];          // 打乱后的数字数组
let target = 1;         // 下一个要点的数字
let max = 9;
let startTime = 0;
let timer = null;
let running = false;

// ---------- 音效 ----------
let actx = null;
function beep(freq, dur = 0.12, type = "sine", vol = 0.15) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function playWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.2), i * 150)); }

// ---------- 语音 ----------
let chosenVoice = null;
function loadVoices() {
  const zh = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
  let p = zh.findIndex(v => v.localService && /tingting|婷婷|meijia|美佳|female|女/i.test(v.name));
  if (p < 0) p = zh.findIndex(v => v.localService);
  if (p < 0) p = 0;
  chosenVoice = zh[p] || null;
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (chosenVoice) u.voice = chosenVoice;
    u.rate = 0.95; u.pitch = 1.05; speechSynthesis.speak(u);
  } catch (e) {}
}

function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ---------- 最佳成绩（按难度，存浏览器本地） ----------
function bestKey() { return "schulte_best_" + N; }
function getBest() {
  try { const v = localStorage.getItem(bestKey()); return v ? parseFloat(v) : null; } catch (e) { return null; }
}
function setBest(sec) {
  try { localStorage.setItem(bestKey(), sec.toFixed(1)); } catch (e) {}
}
function showBest() {
  const b = getBest();
  document.getElementById("bestText").textContent = b ? b.toFixed(1) + " 秒" : "—";
}

// ---------- 计时 ----------
function startTimer() {
  startTime = performance.now();
  running = true;
  timer = setInterval(() => {
    const s = (performance.now() - startTime) / 1000;
    document.getElementById("timeText").textContent = s.toFixed(1);
  }, 100);
}
function stopTimer() {
  running = false;
  if (timer) { clearInterval(timer); timer = null; }
  return (performance.now() - startTime) / 1000;
}

// ---------- 新游戏 ----------
function newGame() {
  if (timer) { clearInterval(timer); timer = null; }
  running = false;
  max = N * N;
  target = 1;
  nums = shuffle(Array.from({ length: max }, (_, i) => i + 1));
  document.getElementById("timeText").textContent = "0.0";
  document.getElementById("nextNum").textContent = "1";
  showBest();

  const grid = document.getElementById("grid");
  const size = { 2: "clamp(80px,30vw,120px)", 3: "clamp(72px,24vw,104px)", 4: "clamp(60px,19vw,88px)", 5: "clamp(50px,16vw,74px)" }[N];
  grid.style.gridTemplateColumns = `repeat(${N}, ${size})`;
  grid.style.fontSize = `calc(${size} * 0.42)`;
  grid.innerHTML = "";
  nums.forEach(n => {
    const d = document.createElement("div");
    d.className = "cell";
    d.style.width = size; d.style.height = size;
    d.style.fontSize = `calc(${size} * 0.45)`;
    d.textContent = n;
    d.dataset.n = n;
    d.onclick = () => onCellClick(n, d);
    grid.appendChild(d);
  });
  setTip("从 1 开始，按顺序一个一个点下去！");
}

// ---------- 点击 ----------
function onCellClick(n, el) {
  if (el.classList.contains("done")) return;
  if (n === target) {
    if (target === 1) startTimer();   // 点中 1 时开始计时
    el.classList.add("done");
    el.style.animation = "pop .4s";
    beep(540 + target * 12, 0.08);
    target++;
    document.getElementById("nextNum").textContent = target <= max ? target : "✓";
    if (target > max) finish();
  } else {
    el.classList.add("wrong");
    beep(220, 0.12, "square");
    setTip(`要先找 ${target} 哦，仔细看看 🔎`);
    setTimeout(() => el.classList.remove("wrong"), 400);
  }
}

// ---------- 完成 ----------
function finish() {
  const sec = stopTimer();
  document.getElementById("timeText").textContent = sec.toFixed(1);
  const prev = getBest();
  let msg = `全部点对啦！用了 ${sec.toFixed(1)} 秒 🌟`;
  if (prev === null || sec < prev) { setBest(sec); msg += "　破纪录啦！🏅"; }
  showBest();
  setTip(msg);
  playWin(); confetti();
  speak(`${CHILD_NAME}真专心！全部找到啦`);
}

// ---------- 撒花 ----------
function confetti() {
  const box = document.getElementById("confetti");
  const emojis = ["🌟","🎉","⭐","🔢","🎈","💖","✨","🏅"];
  for (let i = 0; i < 36; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 3500);
  }
}

function setTip(t) { document.getElementById("tip").textContent = t; }

// ---------- 事件 ----------
document.getElementById("levels").addEventListener("click", e => {
  const btn = e.target.closest(".pick-btn"); if (!btn) return;
  document.querySelectorAll("#levels .pick-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  N = parseInt(btn.dataset.n, 10); beep(520, 0.1); newGame();
});
document.getElementById("newBtn").onclick = () => { beep(520, 0.1); newGame(); };

// 启动
newGame();
</script>
</body>
</html>
