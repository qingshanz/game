<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>✏️ 连线成画 · 小朋友练手眼</title>
<style>
  :root { --shadow: rgba(0,0,0,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "PingFang SC", "Microsoft YaHei", "Comic Sans MS", system-ui, sans-serif;
    background: linear-gradient(160deg, #e1f5fe, #fff3e0);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 12px 12px 24px; color: #00838f; user-select: none;
  }
  h1 { font-size: clamp(22px, 5.6vw, 38px); margin: 2px 0; text-shadow: 2px 2px 0 #fff; text-align: center; }
  .tip {
    font-size: clamp(15px, 3.6vw, 20px); margin: 8px 0; background: #fff;
    padding: 8px 16px; border-radius: 999px; box-shadow: 0 3px 10px var(--shadow);
    min-height: 1.4em; text-align: center; color: #455a64; max-width: 92vw;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-bottom: 8px; }
  .pick-btn {
    font-size: clamp(13px, 3.6vw, 18px); font-weight: 700; padding: 8px 14px;
    border: none; border-radius: 16px; background: #fff; color: #00838f;
    cursor: pointer; box-shadow: 0 4px 0 #a5dde3; transition: transform .08s, background .2s;
  }
  .pick-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #a5dde3; }
  .pick-btn.active { background: #26c6da; box-shadow: 0 4px 0 #00838f; color: #fff; }

  .canvas-wrap {
    background: #fff; border-radius: 26px; box-shadow: 0 8px 22px var(--shadow);
    padding: 12px; margin: 8px 0 14px; width: min(86vw, 380px);
  }
  svg { width: 100%; height: auto; display: block; touch-action: manipulation; }
  .seg { stroke: #00acc1; stroke-width: 2.4; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .fillshape { stroke: #00838f; stroke-width: 2.4; stroke-linejoin: round; }
  .dot { stroke-width: 2; }
  .dot-todo { fill: #fff; stroke: #90a4ae; }
  .dot-done { fill: #66bb6a; stroke: #2e7d32; }
  .dot-next { fill: #fff59d; stroke: #fbc02d; animation: pulse 1s infinite; }
  @keyframes pulse { 0%,100%{ r:5 } 50%{ r:6.6 } }
  .numtext { font-size: 6px; font-weight: 800; fill: #455a64; pointer-events: none; }
  .numtext-next { fill: #f57f17; }

  .tools { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .tool-btn {
    font-size: clamp(15px, 4vw, 19px); font-weight: 700; padding: 11px 22px;
    border: none; border-radius: 16px; background: #ffd54f; color: #6d4c41;
    cursor: pointer; box-shadow: 0 4px 0 #f9a825;
  }
  .tool-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #f9a825; }

  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .star { position: fixed; top: -40px; font-size: 28px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .9; } }
</style>
</head>
<body>
  <a id="backHome" href="index.html" style="position:fixed;top:10px;left:10px;z-index:9999;display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-family:inherit;font-size:15px;font-weight:800;color:#fff;background:rgba(94,53,177,.85);padding:8px 14px;border-radius:999px;box-shadow:0 3px 8px rgba(0,0,0,.22);-webkit-tap-highlight-color:transparent;">⬅️ 返回</a>
  <h1>✏️ 郑直的连线成画 🎨</h1>
  <div class="tip" id="tip">按数字 1、2、3…… 的顺序点圆点，把画连出来！</div>

  <div class="row" id="shapes">
    <button class="pick-btn active" data-s="house">🏠 房子</button>
    <button class="pick-btn" data-s="fish">🐟 小鱼</button>
    <button class="pick-btn" data-s="heart">❤️ 爱心</button>
    <button class="pick-btn" data-s="star">⭐ 星星</button>
  </div>

  <div class="canvas-wrap"><svg id="svg" viewBox="0 0 100 100"></svg></div>

  <div class="tools">
    <button class="tool-btn" id="newBtn">🔄 重新连</button>
  </div>

  <div id="confetti"></div>

<script>
/* =======================================================================
   连线成画 —— 按数字顺序连点成画
   按 1→2→3…… 顺序点圆点，连线最终拼出一幅画。
   锻炼学前儿童的手眼协调、数序认知与专注力。
   ======================================================================= */

const CHILD_NAME = "郑直";

// 五角星顶点（外/内交替，共 10 点）
function starPoints() {
  const pts = [], cx = 50, cy = 52, R = 40, r = 16;
  for (let k = 0; k < 5; k++) {
    const ao = (-90 + k * 72) * Math.PI / 180;
    pts.push([cx + R * Math.cos(ao), cy + R * Math.sin(ao)]);
    const ai = (-90 + 36 + k * 72) * Math.PI / 180;
    pts.push([cx + r * Math.cos(ai), cy + r * Math.sin(ai)]);
  }
  return pts.map(p => [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]);
}

const SHAPES = {
  house: { name: "房子", emoji: "🏠", color: "#ffab91",
    pts: [[28,88],[28,52],[50,30],[72,52],[72,88]] },
  fish:  { name: "小鱼", emoji: "🐟", color: "#81d4fa",
    pts: [[20,52],[40,36],[62,40],[78,28],[76,52],[78,76],[62,64],[40,68]] },
  heart: { name: "爱心", emoji: "❤️", color: "#ef9a9a",
    pts: [[50,40],[42,30],[30,29],[24,41],[31,56],[50,74],[69,56],[76,41],[70,29],[58,30]] },
  star:  { name: "星星", emoji: "⭐", color: "#ffe082", pts: starPoints() },
};

let shapeKey = "house";
let pts = [];
let drawn = 0;       // 已连接的点数（下一个要点的索引 = drawn）
let done = false;

// ---------- 音效 ----------
let actx = null;
function beep(freq, dur = 0.1, type = "sine", vol = 0.14) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(vol, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime + dur);
    o.start(); o.stop(actx.currentTime + dur);
  } catch (e) {}
}
function playWin() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => beep(f, 0.18, "triangle", 0.2), i * 150)); }

// ---------- 语音 ----------
let chosenVoice = null;
function loadVoices() {
  const zh = speechSynthesis.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("zh"));
  let p = zh.findIndex(v => v.localService && /tingting|婷婷|meijia|美佳|female|女/i.test(v.name));
  if (p < 0) p = zh.findIndex(v => v.localService);
  if (p < 0) p = 0;
  chosenVoice = zh[p] || null;
}
if ("speechSynthesis" in window) { speechSynthesis.onvoiceschanged = loadVoices; loadVoices(); }
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; if (chosenVoice) u.voice = chosenVoice;
    u.rate = 0.95; u.pitch = 1.05; speechSynthesis.speak(u);
  } catch (e) {}
}

// ---------- 新画 ----------
function newPic() {
  pts = SHAPES[shapeKey].pts;
  drawn = 0;
  done = false;
  render();
  setTip("按数字 1、2、3…… 的顺序点圆点 👆");
  speak("从数字 1 开始，按顺序点圆点");
}

// ---------- 渲染 ----------
function render() {
  const svg = document.getElementById("svg");
  let html = "";

  // 已连接的线段
  if (drawn >= 2) {
    const line = pts.slice(0, drawn).map(p => p.join(",")).join(" ");
    html += `<polyline class="seg" points="${line}"/>`;
  }
  // 完成后闭合填充
  if (done) {
    const poly = pts.map(p => p.join(",")).join(" ");
    html += `<polygon class="fillshape" points="${poly}" fill="${SHAPES[shapeKey].color}"/>`;
    html += `<text x="50" y="54" text-anchor="middle" dominant-baseline="central" style="font-size:26px">${SHAPES[shapeKey].emoji}</text>`;
  }
  // 圆点 + 编号
  if (!done) {
    pts.forEach((p, i) => {
      let cls = "dot-todo";
      if (i < drawn) cls = "dot-done";
      else if (i === drawn) cls = "dot-next";
      html += `<circle data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="5" class="dot ${cls}"/>`;
      // 透明大热区，方便点
      html += `<circle data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="9" fill="transparent"/>`;
      html += `<text class="numtext ${i === drawn ? 'numtext-next' : ''}" x="${p[0]}" y="${p[1] - 8}" text-anchor="middle">${i + 1}</text>`;
    });
  }
  svg.innerHTML = html;
}

// ---------- 点击圆点 ----------
document.getElementById("svg").addEventListener("click", e => {
  if (done) return;
  const c = e.target.closest("[data-i]");
  if (!c) return;
  const i = parseInt(c.dataset.i, 10);
  if (i === drawn) {
    drawn++;
    beep(520 + drawn * 18, 0.07);
    if (drawn === pts.length) finish();
    else render();
  } else {
    beep(220, 0.12, "square");
    setTip(`先点数字 ${drawn + 1} 哦 🔢`);
  }
});

// ---------- 完成 ----------
function finish() {
  done = true;
  render();
  setTip(`连好啦！是一个${SHAPES[shapeKey].name} ${SHAPES[shapeKey].emoji} 🎉`);
  playWin(); confetti();
  speak(`${CHILD_NAME}连好啦！是一个${SHAPES[shapeKey].name}`);
}

// ---------- 撒花 ----------
function confetti() {
  const box = document.getElementById("confetti");
  const emojis = ["🌟","🎉","⭐","🎨","🎈","💖","✨", SHAPES[shapeKey].emoji];
  for (let i = 0; i < 34; i++) {
    const s = document.createElement("div");
    s.className = "star";
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = Math.random() * 100 + "vw";
    s.style.animationDuration = (1.6 + Math.random() * 1.8) + "s";
    box.appendChild(s);
    setTimeout(() => s.remove(), 3500);
  }
}

function setTip(t) { document.getElementById("tip").textContent = t; }

// ---------- 事件 ----------
document.getElementById("shapes").addEventListener("click", e => {
  const btn = e.target.closest(".pick-btn"); if (!btn) return;
  document.querySelectorAll("#shapes .pick-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  shapeKey = btn.dataset.s; beep(600, 0.1); newPic();
});
document.getElementById("newBtn").onclick = () => { beep(520, 0.1); newPic(); };

// 启动
newPic();
</script>
</body>
</html>
